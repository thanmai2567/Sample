<h3>Current Weather</h3>
<input type="text" id="cityInput" placeholder="Enter city">
<button onclick="getCurrentWeather()">Get Weather</button>
<table border="1" id="currentWeatherTable">
  <tr>
    <th>City</th>
    <th>Min Temp (°C)</th>
    <th>Max Temp (°C)</th>
    <th>Humidity (%)</th>
  </tr>
</table>

<script>
const apiKey = 'f74bc7f093218ecccdd7ec473bea841c'; // Your actual API key

async function getCurrentWeather() {
  const city = document.getElementById('cityInput').value;
  if (!city) {
    alert("Please enter a city name.");
    return;
  } 

  const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.cod !== 200) {
      alert("City not found. Please check the name and try again.");
      return;
    }

    const table = document.getElementById('currentWeatherTable');
    table.innerHTML = `
      <tr>
        <th>City</th>
        <th>Min Temp (°C)</th>
        <th>Max Temp (°C)</th>
        <th>Humidity (%)</th>
      </tr>
      <tr>
        <td>${data.name}</td>
        <td>${data.main.temp_min}</td>
        <td>${data.main.temp_max}</td>
        <td>${data.main.humidity}</td>
      </tr>
    `;
  } catch (err) {
    alert("Something went wrong while fetching the data.");
    console.error(err);
  }
}
</script>
